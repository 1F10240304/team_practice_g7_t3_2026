{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ</title>
  <link rel="stylesheet" href="{% static 'css/senior_mypage.css' %}">
</head>
<body>
  <h1>マイページ</h1>

  <section>
    <h2>あなたのプロフィール</h2>
    <dl>
      <dt>お名前</dt><dd>{{ profile.name }}</dd>
      <dt>お住まいの地域</dt><dd>{{ profile.area }}</dd>
      <dt>自己紹介</dt><dd>{{ profile.introduction|default:"未入力" }}</dd>
      <dt>頼みたいこと</dt><dd>{{ profile.needs|default:"未入力" }}</dd>
    </dl>
  </section>

  <section>
    <h2>プロフィールを直す</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">保存する</button>
    </form>
  </section>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">ログアウト</button>
  </form>
</body>
</html>
