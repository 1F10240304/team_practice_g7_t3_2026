{% extends 'base.html' %}

{% block content %}
<div style="text-align: center; margin-top: 50px;">
    <h2>シニア向けホーム画面</h2>
    <p style="font-size: 1.2em; margin-bottom: 40px;">こんにちは！今日はどのようなお手伝いが必要ですか？</p>
    
    <!-- ボタンを縦に並べて押しやすくする -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 30px;">
        
        <!-- お願いを作成するボタン -->
        <!-- urls.py で設定している依頼作成ページのURL名（例: create_request）を指定 -->
        <a href="{% url 'create_request' %}" style="display: block; width: 80%; max-width: 400px; padding: 25px; background-color: #ff9800; color: white; text-decoration: none; border-radius: 12px; font-size: 1.5em; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            📝 新しくお願いをする
        </a>

        <!-- これまでのお願いを確認するボタン -->
        <!-- urls.py で設定している依頼一覧ページのURL名（例: request_list）を指定 -->
        <a href="{% url 'request_list' %}" style="display: block; width: 80%; max-width: 400px; padding: 25px; background-color: #4caf50; color: white; text-decoration: none; border-radius: 12px; font-size: 1.5em; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            📋 お願いしたことを見る
        </a>
        
    </div>

    <!-- 役割選択に戻るリンク（テスト用・不要なら削除してください） -->
    <div style="margin-top: 50px;">
        <a href="{% url 'select_role' %}" style="color: #666; text-decoration: underline; font-size: 1.1em;">
            役割選択画面に戻る
        </a>
    </div>
</div>
{% endblock %}
