<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム | ここにいるよ</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm py-4 px-6 text-center">
        <h1 class="text-xl font-bold text-orange-500 tracking-wider">ここにいるよ</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 text-center">
        <!-- ユーザーへの声かけ -->
        <div class="mb-8">
            <p class="text-gray-500 text-lg mb-2">こんにちは！</p>
            <h2 class="text-3xl font-bold text-gray-700">今日はどうしますか？</h2>
        </div>

        <!-- 2つの巨大なメインメニューボタン -->
        <div class="flex flex-col gap-6 w-full max-w-md">
            
            <!-- ① 手伝ってほしいボタン（担当の依頼作成ページへ繋がる！） -->
            <a href="{% url 'create_request' %}" class="bg-orange-500 hover:bg-orange-600 text-white rounded-3xl p-8 shadow-lg transition-transform transform hover:scale-105 flex flex-col items-center justify-center group">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform duration-200">🙋‍♀️</div>
                <h3 class="text-3xl font-bold mb-2">手伝ってほしい</h3>
                <p class="text-orange-100 text-base">買い物、電球交換、ちょっとした作業など</p>
            </a>

            <!-- ② お話したいボタン（交流機能・現在は仮置き） -->
            <a href="#" class="bg-white border-4 border-orange-400 hover:bg-orange-50 text-orange-600 rounded-3xl p-8 shadow-lg transition-transform transform hover:scale-105 flex flex-col items-center justify-center group">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform duration-200">☕</div>
                <h3 class="text-3xl font-bold mb-2">お話したい</h3>
                <p class="text-orange-500 text-base">学生と一緒にお茶や散歩、趣味の共有など</p>
            </a>

        </div>

        <!-- 戻るリンク -->
        <div class="mt-12">
            <a href="{% url 'select_role' %}" class="text-gray-400 hover:text-gray-600 underline font-medium transition text-lg">
                役割選択に戻る
            </a>
        </div>
    </main>

</body>
</html>
