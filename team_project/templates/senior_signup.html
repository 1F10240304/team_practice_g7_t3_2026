{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録（手伝ってほしい方）</title>
  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>
  <h1>新規登録（手伝ってほしい方）</h1>
  <form method="post">
    {% csrf_token %}
    {{ user_form.as_p }}
    {{ profile_form.as_p }}
    <button type="submit">登録する</button>
  </form>
  <p><a href="{% url 'select_role' %}">戻る</a> ／ 登録済みの方は <a href="{% url 'login' %}">ログイン</a></p>
</body>
</html>
