<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ここにいるよ | 多世代交流アプリ</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- ヘッダー -->
    <header class="bg-white shadow-sm py-4 px-6">
        <h1 class="text-2xl font-bold text-orange-500 text-center tracking-wider">ここにいるよ</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 text-center">
        <!-- キャッチコピー -->
        <h2 class="text-3xl md:text-4xl font-bold mb-4 leading-tight">
            会話と支え合いをつなぐ<br>
            <span class="text-orange-500">多世代交流アプリ</span>
        </h2>
        <p class="text-base md:text-lg text-gray-600 mb-10 max-w-md">
            高齢者の「ちょっと助けて」と、学生の「スキマ時間」を繋ぎます。支援ではなく、対等な支え合いから新しい絆が生まれます。
        </p>

        <!-- アクションボタン -->
        <!-- ここで担当の select_role（役割選択ページ）へ繋ぎます！ -->
        <div class="flex flex-col w-full max-w-xs space-y-4">
            <a href="{% url 'select_role' %}" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg transition-transform transform hover:scale-105">
                新規会員登録
            </a>
            <a href="{% url 'login' %}" class="bg-white border-2 border-orange-200 hover:bg-orange-100 text-orange-500 font-bold py-3 px-8 rounded-full text-lg shadow-sm transition">
                ログイン
            </a>
        </div>

        <!-- 3つの特徴（プレゼン資料の強みを反映） -->
        <div class="mt-16 grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl text-left">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <h3 class="text-xl font-bold text-orange-500 mb-2">🎤 声で簡単</h3>
                <p class="text-gray-600 text-sm">面倒な文字入力の壁を排除。普段通りの言葉で話しかけるだけで、AIが依頼を作成します。</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <h3 class="text-xl font-bold text-orange-500 mb-2">⏰ スキマ時間</h3>
                <p class="text-gray-600 text-sm">学生は大学の近くや自分の空き時間に合わせて、単発で気軽に活動を引き受けられます。</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <h3 class="text-xl font-bold text-orange-500 mb-2">💡 知恵の交換</h3>
                <p class="text-gray-600 text-sm">作業完了後は、高齢者から暮らしの知恵や経験を教わる「互酬的な関係」をサポートします。</p>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-orange-200 py-6 text-center text-orange-800 text-sm mt-auto">
        <p>&copy; 2026 グループ7 チーム3. All rights reserved.</p>
    </footer>

</body>
</html>
