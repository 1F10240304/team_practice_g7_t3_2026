<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>役割の選択 | ここにいるよ</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm py-4 px-6 text-center">
        <h1 class="text-xl font-bold text-orange-500 tracking-wider">ここにいるよ</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 text-center">
        <h2 class="text-2xl md:text-3xl font-bold mb-10 text-gray-700">あなたはどちらですか？</h2>

        <!-- ボタンを並べる枠（スマホでは縦並び、PCでは横並び） -->
        <div class="flex flex-col md:flex-row gap-6 w-full max-w-2xl">
            
            <!-- 修正前： <a href="{% url 'elderly_home' %}" ...> -->
        <!-- 修正後： 高齢者用サインアップ（senior_signup）へ繋ぐ -->
        <a href="{% url 'senior_signup' %}" class="flex-1 bg-white border-4 border-orange-400 ...">
            <div class="text-6xl mb-4 group-hover:scale-110 ...">👵</div>
            <h3 class="text-2xl font-bold text-orange-600 mb-2">高齢者の方</h3>
            <p class="text-gray-500 text-sm font-medium">手伝ってほしい・お話したい</p>
        </a>

        <!-- 修正前： <a href="#" ...> -->
        <!-- 修正後： 学生用サインアップ（student_signup）へ繋ぐ -->
        <a href="{% url 'student_signup' %}" class="flex-1 bg-white border-4 border-blue-400 ...">
            <div class="text-6xl mb-4 group-hover:scale-110 ...">🎓</div>
            <h3 class="text-2xl font-bold text-blue-600 mb-2">学生の方</h3>
            <p class="text-gray-500 text-sm font-medium">スキマ時間で手伝いたい</p>
        </a>

        </div>

        <!-- 戻るリンク -->
        <div class="mt-12">
            <a href="{% url 'index' %}" class="text-gray-400 hover:text-gray-600 underline font-medium transition">
                トップページに戻る
            </a>
        </div>
    </main>

</body>
</html>
