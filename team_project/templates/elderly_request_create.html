{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼する | ここにいるよ</title>
    <!-- 共通のCSSを読み込む -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <h1 class="header-title">ここにいるよ</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
        <h2 class="question-text">声でたすけて</h2>
        <p class="instruction-text">
            マイクを押して、困りごとを話してください。<br>
            <span class="instruction-example">（例：「明日の午前中に電球を替えてほしい」）</span>
        </p>

        {% if error %}
            <p class="form-error">{{ error }}</p>
        {% endif %}

        <!-- 巨大なマイクボタン -->
        <!-- type="button" にすることで、勝手にページが切り替わるのを防ぎます -->
        <button id="mic-btn" class="btn-mic" type="button">
            <span class="mic-icon">🎙️</span>
            <span id="mic-text">おして話す</span>
        </button>

        <!-- 録音中であることを知らせる文字（最初は非表示） -->
        <div id="recording-status" class="recording-status hidden">
            録音しています...
        </div>

        <!-- 話した内容は下の欄に入る。マイクが使えないときは文字で書ける -->
        <form method="post" action="{% url 'confirm_request' %}" class="request-form">
            {% csrf_token %}
            <label for="request-text" class="request-label">話した内容（書いて直すこともできます）</label>
            <textarea id="request-text" name="text" class="request-text" rows="3"></textarea>
            <p id="mic-unsupported" class="instruction-example hidden">
                このブラウザでは声で入力できません。上の欄に書いてください。
            </p>

            <!-- 修正前： <a href="#" id="submit-btn" ...> -->
            <!-- 修正後： マイクで喋り終わったら確認画面へ飛ぶ -->
            <a href="{% url 'elderly_request_confirm' %}" id="submit-btn" class="btn-submit hidden">
                話し終わった（次へ）
            </a>
        </form>

        <!-- 戻るリンク -->
        <a href="{% url 'elderly_home' %}" class="back-link">ホームに戻る</a>
    </main>

    <script src="{% static 'js/elderly_request_create.js' %}"></script>
</body>
</html>
