{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼する | ここにいるよ</title>
    <!-- 共通のCSSを読み込む -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <h1 class="header-title">ここにいるよ</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
        <h2 class="question-text">声でたすけて</h2>
        <p class="instruction-text">
            マイクを押して、困りごとを話してください。<br>
            <span style="font-size: 14px; color: #9ca3af;">（例：「電球を替えてほしい」「重い荷物を運んでほしい」）</span>
        </p>

        <!-- 巨大なマイクボタン -->
        <!-- type="button" にすることで、勝手にページが切り替わるのを防ぎます -->
        <button id="mic-btn" class="btn-mic" type="button">
            <span class="mic-icon">🎙️</span>
            <span id="mic-text">おして話す</span>
        </button>

        <!-- 録音中であることを知らせる文字（最初は非表示） -->
        <div id="recording-status" class="recording-status hidden">
            録音しています...
        </div>

        <!-- 次の画面へ進むボタン（最初は非表示） -->
        <!-- ※あとでAI要約確認ページ（elderly_request_confirm）へ繋ぎます -->
        <a href="#" id="submit-btn" class="btn-submit hidden">
            話し終わった（次へ）
        </a>

        <!-- 戻るリンク -->
        <a href="{% url 'elderly_home' %}" class="back-link">ホームに戻る</a>
    </main>

    <!-- 画面に動きをつけるJavaScript（デモ用） -->
    <script>
        // HTMLの中のボタンやテキストを見つけてくる
        const micBtn = document.getElementById('mic-btn');
        const micText = document.getElementById('mic-text');
        const statusText = document.getElementById('recording-status');
        const submitBtn = document.getElementById('submit-btn');
        
        // 録音中かどうかの状態を保存する変数
        let isRecording = false;

        // マイクボタンがクリックされた時の処理
        micBtn.addEventListener('click', () => {
            if (!isRecording) {
                // 【録音スタート】
                isRecording = true;
                micBtn.classList.add('recording'); // 赤くしてドクンドクンさせる
                micText.innerText = "録音中...";
                statusText.classList.remove('hidden'); // 「録音しています」の文字を出す
                submitBtn.classList.remove('hidden');  // 「次へ」ボタンを出す
            } else {
                // 【録音ストップ】（もう一度押した場合）
                isRecording = false;
                micBtn.classList.remove('recording'); // 元のオレンジに戻す
                micText.innerText = "もう一度やり直す";
                statusText.classList.add('hidden'); // 文字を隠す
            }
        });
    </script>
</body>
</html>
