{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン</title>
  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>
  <h1>ログイン</h1>
  {% if form.errors %}
    <p class="error">ユーザー名またはパスワードが違います。</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">ログイン</button>
  </form>
  <p>はじめての方は <a href="{% url 'select_role' %}">新規登録</a></p>
</body>
</html>
