{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | ここにいるよ</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>
  <header class="header">
    <h1 class="header-title">ここにいるよ</h1>
  </header>

  <main class="auth-content">
    <div class="auth-card">
      <div class="auth-icon">🔑</div>
      <h2 class="auth-title">ログイン</h2>
      <p class="auth-lead">ユーザー名とパスワードを入れてください</p>

      {% if form.errors %}
        <p class="auth-error">ユーザー名またはパスワードが違います。</p>
      {% endif %}
      <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="auth-submit">ログイン</button>
      </form>

      <p class="auth-links">はじめての方は <a href="{% url 'select_role' %}">新規登録</a></p>
    </div>
  </main>
</body>
</html>
