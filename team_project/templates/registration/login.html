<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; font-size: 18px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 18px; }
    button { padding: 8px 24px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>ログイン</h1>
  {% if form.errors %}
    <p>ユーザー名またはパスワードが違います。</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
