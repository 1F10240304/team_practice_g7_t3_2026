{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生マイページ</title>
  <link rel="stylesheet" href="{% static 'css/student_mypage.css' %}">
</head>
<body>
  <h1>学生マイページ</h1>

  <section>
    <h2>プロフィール</h2>
    <dl>
      <dt>名前</dt><dd>{{ profile.name }}</dd>
      <dt>大学・学年</dt><dd>{{ profile.university }}</dd>
      <dt>自己紹介</dt><dd>{{ profile.introduction|default:"未入力" }}</dd>
      <dt>できること</dt><dd>{{ profile.skills|default:"未入力" }}</dd>
    </dl>
  </section>

  <section>
    <h2>プロフィールを編集</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">保存する</button>
    </form>
  </section>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">ログアウト</button>
  </form>
</body>
</html>
